apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfilment-processor
  labels: 
    kubernetes.courselabs.co: monitoring
spec:
  selector:
    matchLabels:
      app: fulfilment
      component: processor
  template:
    metadata:
      labels:
        app: fulfilment
        component: processor
      annotations:        
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9110'
    spec:
      containers:
        - name: app
          image: courselabs/fulfilment-processor@sha256:578bc38424a1891bbe613925a04e27461fd6cad36de31a2efdbab0acb5d19b26
          env:
            - name: Observability__Metrics__IncludeRuntime
              value: 'true'
          ports:
            - containerPort: 9110
              name: metrics
