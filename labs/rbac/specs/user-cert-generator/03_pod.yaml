apiVersion: v1
kind: Pod
metadata:
  name: user-cert-generator
  labels:
    kubernetes.courselabs.co: rbac
spec:
  serviceAccountName: user-cert-generator
  containers:
    - name: user-cert-generator
      image: ghcr.io/yasinoz/kiamol/ch17-user-cert-generator:latest
      env:
        - name: USER_NAME
          value: reader@courselabs.co
        - name: GROUP
          value: courselabs
