apiVersion: batch/v1
kind: Job
metadata:
  name: pi-job-one-failing
  labels:
    kubernetes.courselabs.co: jobs
spec:
  completions: 1
  backoffLimit: 4
  template:
    spec:
      containers:
        - name: pi
          image: ghcr.io/yasinoz/kiamol/ch05-pi:latest
          command: ["donet", "Pi.Web.dll", "-m", "console", "-dp", "50"]
      restartPolicy: Never
