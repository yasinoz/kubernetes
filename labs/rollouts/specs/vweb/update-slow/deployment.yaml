apiVersion: apps/v1
kind: Deployment
metadata:
  name: vweb
  labels: 
    kubernetes.courselabs.co: rollouts
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vweb
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 
      maxSurge: 1
  template:
    metadata:
      labels:
        app: vweb
    spec:
      initContainers:
        - name: wait
          image: ghcr.io/yasinoz/kiamol/ch03-sleep:latest
          command: ['sh', '-c', 'sleep 3s']
      containers:
        - name: web
          image: ghcr.io/yasinoz/kiamol/ch09-vweb:v2
          ports:
            - name: http
              containerPort: 80

