apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  labels:
    kubernetes.courselabs.co: clusters
spec:
  replicas: 4
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: app
          image: ghcr.io/yasinoz/sixeyed/whoami:24.07
      tolerations:
        - key: "disk"
          operator: "Equal"
          value: "hdd"
          effect: "NoSchedule"
