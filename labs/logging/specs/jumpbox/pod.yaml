apiVersion: v1
kind: Pod
metadata:
  name: jumpbox
  labels:
    kubernetes.courselabs.co: logging
spec:
  containers:
    - name: sleep
      image: ghcr.io/yasinoz/kiamol/ch03-sleep:latest
      volumeMounts:
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
  volumes:
    - name: varlog
      hostPath:
        path: /var/log
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers
