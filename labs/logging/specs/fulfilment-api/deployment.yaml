apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfilment-api
  labels: 
    kubernetes.courselabs.co: logging
spec:
  selector:
    matchLabels:
      app: fulfilment
      component: api
  template:
    metadata:
      labels:
        app: fulfilment
        component: api
    spec:
      containers:
        - name: app
          image: courselabs/fulfilment-api@sha256:ee65224fb578b2ff909358edb1e488e25dd8fafdac668bba97d26825a9b8278c
          ports:
            - containerPort: 80
              name: http
