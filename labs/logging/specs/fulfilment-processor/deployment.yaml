apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfilment-processor
  labels: 
    kubernetes.courselabs.co: logging
spec:
  selector:
    matchLabels:
      app: fulfilment
      component: processor
  template:
    metadata:
      labels:
        app: fulfilment
        component: processor
    spec:
      containers:
        - name: app
          image: courselabs/fulfilment-processor@sha256:578bc38424a1891bbe613925a04e27461fd6cad36de31a2efdbab0acb5d19b26
          env:
            - name: Observability__Logging__File
              value: 'true'
            - name: Observability__Logging__Console
              value: 'false'
            - name: Observability__Logging__LogFilePath
              value: /app/logs/fulfilment-processor.log
